[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-inspector"
version = "0.2.0"
description = "An evidence-first investigative agent for the Philippine national budget."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Vibe Coders Team", email = "kaarlan@up.edu.ph" }
]
dependencies = [
  "duckdb>=1.0.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "pyarrow>=15.0.0",
  "rapidfuzz>=3.0.0",
  "pydantic>=2.0.0",
  "typer>=0.9.0",
  "requests>=2.30.0",
  "beautifulsoup4>=4.12.0",
  "tabulate>=0.9.0",
  "rich>=13.0.0",
  "fastapi>=0.100.0",
  "jinja2>=3.1.0",
  "uvicorn>=0.20.0",
  "python-multipart>=0.0.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.25.0"
]

[project.scripts]
budget-inspector = "budget_inspector.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
